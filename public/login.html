<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · AML Alert Triage</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=11">
</head>
<body class="signin-page">
  <main class="signin">
    <div class="card signin-card">
      <div class="signin-brand" id="signin-brand"></div>
      <h1>Sign in</h1>
      <p class="lead">Investigate transaction-monitoring alerts and record the compliance officer's disposition.</p>

      <div id="demo" hidden>
        <p class="small" style="margin-bottom:10px">Choose your account.</p>
        <div class="demo-list" id="demo-buttons"></div>
        <div class="alert bad" id="demo-error" hidden style="margin-top:12px"></div>
      </div>

      <form id="login-form" novalidate class="stack" style="gap:14px">
        <label class="field"><span>Email</span><input type="email" id="email" autocomplete="username" required></label>
        <label class="field"><span>Password</span><input type="password" id="password" autocomplete="current-password" required></label>
        <div class="alert bad" id="login-error" hidden></div>
        <button class="btn primary block" type="submit" id="login-btn">Sign in</button>
      </form>
    </div>
  </main>
  <footer class="footer" id="signin-footer"></footer>
  <script src="/common.js?v=11"></script>
  <script src="/login.js?v=11"></script>
</body>
</html>
