<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css?v=2">
</head>
<body>
<div id="root" class="boot"></div>
<template id="tpl">
  <div class="page-head">
    <div><h1 id="hello">Dashboard</h1><div class="sub" id="sub">Alert triage at a glance.</div></div>
    <div class="row" id="head-actions"></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="grid grid-2">
    <section class="card">
      <div class="card-head"><h2 id="left-title">Waiting for a decision</h2><a href="/reviews.html" class="small" id="left-link">Open review queue</a></div>
      <div id="left"></div>
    </section>
    <section class="card">
      <div class="card-head"><h2>Recent alerts</h2><a href="/alerts.html" class="small">All alerts</a></div>
      <div id="recent"></div>
    </section>
  </div>
</template>
<script src="/common.js?v=2"></script>
<script src="/dashboard.js?v=2"></script>
</body>
</html>
