<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case queues · AML Alert Triage</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=8">
</head>
<body data-kind="queues">
  <main>
    <div class="page-head">
      <div>
        <p class="crumb">Customers &amp; queues</p>
        <h1>Case queues <span class="pill plain ro-pill">Read only</span></h1>
        <p>Where finished alerts were routed, and when each queue's SLA runs out.</p>
      </div>
    </div>
    <div class="alert info source-note" id="source-note"></div>
    <div class="card flush">
      <div class="toolbar" style="padding:14px 16px;border-bottom:1px solid var(--line)">
        <input type="search" id="search" placeholder="Search" aria-label="Search">
        <span class="muted small" id="count-text"></span>
      </div>
      <div class="table-wrap" id="table-wrap"><div class="empty">Loading…</div></div>
    </div>
    <div class="alert bad" id="error" hidden style="margin-top:16px"></div>
  </main>
  <script src="/common.js?v=8"></script>
  <script src="/ledger.js?v=8"></script>
</body>
</html>
